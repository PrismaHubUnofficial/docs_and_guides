site_name: Robotics & Documentation Hub
site_description: Technical manuals and quick guides for robotic systems.
site_author: Simone

theme:
  name: material
  language: en
  favicon: assets/images/favicon.ico
  logo: assets/images/logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

# Questa sezione mappa esattamente le tue cartelle
nav:
  - Home: index.md
  - General Quick Guides:
      - Creating Subtitles: General Quick Guide/QUICK GUIDE — Creating Subtitles.md
      - How to Update the Website: General Quick Guide/QUICK GUIDE — How to update the website.md
      - Using the GitHub Pages Template: General Quick Guide/QUICK GUIDE — Using the GitHub Pages Template.md
      - Voiceover for a Video: General Quick Guide/QUICK GUIDE — Voiceover for a Video.md
  - Robotic Platforms:
      - Status Table: robots/status/robot_status_table.md
      - Aerial:
        - A2RL Drone: robots/a2rl/a2rl_manual_operation.md
        - Baby_K: robots/baby_k/baby_k_manual_operation.md
        - Crazyflie Swarm: robots/crazyflie_swarm/crazyflie_swarm_manual_operation.md
        - M.A.R.A.Drone: robots/dummy/dummy_manual_operation.md
        - P.O.C.H.O.: robots/pocho/pocho_manual_operation.md
        - T.T. Drone: robots/leonardo/leonardo_manual_operation.md
      - Haptic Devices:
        - Falcon: robots/falcon/falcon_manual_operation.md
        - Haption: robots/haption/haption_manual_operation.md
      - Lab Equipment:
        - Equipment Archive: robots/lab_equipment/lab_equipment.md
      - Legged:
        - ANYmal: robots/anymal/anymal_manual_operation.md
        - H1: robots/h1/h1_manual_operation.md
      - Manipulators:
        - Armando: robots/armando/armando_manual_operation.md
        - Franka: robots/franka/franka_manual_operation.md
        - Kuka: robots/kuka_iiwa/kuka_iiwa_manual_operation.md
        - S.W.A.N.: robots/swan/swan_manual_operation.md
      - Museum:
        - Discontinued Projects: robots/museum/museum.md
      - Wheeled:
        - fra2mo: robots/fra2mo/fra2mo_manual_operation.md
        - Rover: robots/rover/rover_manual_operation.md
  - Resources:
      - LaTeX Symbols Guide: pdfs/latex_symbols_guide.pdf
      - Manual Template: robots/manual_operation_template.md
      - Thesis Writing and Supervisor Interaction Guide: https://it.overleaf.com/read/qqyhmvgkfjgh#793535

# Estensioni per rendere il sito professionale (tabelle, note, ecc.)
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list # Necessario per ridimensionare immagini

extra_css:
  - assets/stylesheets/brand-colors.css
